[workspace]
channels  = ["conda-forge", "pytorch"]
name      = "CycPepNet"
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python            = ">=3.12.1,<3.14"
numpy             = ">=2.0"
pandas            = ">=2.0"
matplotlib        = ">=3.8"
seaborn           = ">=0.13"
rdkit             = ">=2024"
openpyxl          = ">=3.1"
pip               = ">=23.0"
scipy             = ">=1.11"
statsmodels       = ">=0.14"
tqdm              = ">=4.67.1,<5"
scikit-learn      = ">=1.8.0,<2"
xgboost           = ">=2.0"
optuna            = ">=3.0"
wandb             = ">=0.25.0,<0.26"
huggingface_hub   = "*"


[target.linux-64.pypi-dependencies]
torch           = { version = "==2.7.0", index = "https://download.pytorch.org/whl/cu128" }
torch-geometric = "==2.7.0"

[target.osx-arm64.dependencies]
pytorch           = ">=2.0"
pytorch_geometric = ">=2.5"

[pypi-dependencies]
p2smi               = ">=1.1.1, <2"
mapchiral           = ">=0.0.7"
mxfp                = ">=1.1.3"
transformers        = ">=4.40"
safetensors         = ">=0.4"
hyper-fingerprints  = ">=0.2.2"

[tasks]

# PROCESSING
process-macrocycledb = "python -m cycpepnet.process.process_macrocycledb"
process-cycpeptmpdb  = "python -m cycpepnet.process.process_cycpeptmpdb"
process-npmmpd       = "python -m cycpepnet.process.process_npmmpd"
process-peplife2     = "python -m cycpepnet.process.process_peplife2"
process-pepmsnd      = "python -m cycpepnet.process.process_pepmsnd"
process-peptherdia   = "python -m cycpepnet.process.process_peptherdia"

process-all = { depends-on = ["process-cycpeptmpdb", "process-macrocycledb", "process-npmmpd", "process-peplife2", "process-pepmsnd", "process-peptherdia"] }

# COMBINING
combine-cycpeptmpdb-npmmpd       = { cmd = "python -m cycpepnet.combine.combine_cycpeptmpdb_npmmpd",       depends-on = ["process-cycpeptmpdb", "process-npmmpd"] }
combine-halflife-peptides        = { cmd = "python -m cycpepnet.combine.combine_halflife_peptides",        depends-on = ["process-peplife2", "process-pepmsnd", "process-peptherdia"] }

combine-all = { depends-on = ["combine-cycpeptmpdb-npmmpd", "combine-halflife-peptides"] }

# GENERATE SPLITS
generate-splits = "python -m cycpepnet.benchmark"

# ANALYSIS
analyze-similarity    = "python -m cycpepnet.analyze.analyze_similarity"
analyze-tasks         = "python -m cycpepnet.analyze.analyze_tasks"
analyze-splits        = "python -m cycpepnet.analyze.analyze_splits"
analyze-uncertainty   = "python -m cycpepnet.analyze.analyze_uncertainty"
analyze-tests         = { cmd = "python -m cycpepnet.analyze.statistical_tests",     depends-on = ["analyze-uncertainty"] }
analyze-ranking       = "python -m cycpepnet.analyze.analyze_ranking"
analyze-results       = { cmd = "python -m cycpepnet.analyze.analyze_results",       depends-on = ["analyze-tests", "analyze-ranking"] }
analyze-distributions = { cmd = "python -m cycpepnet.analyze.analyze_distributions", depends-on = ["analyze-tests"] }
analyze-all           = "python -m cycpepnet.reproduce"

# CURATION + REPRESENTATIONS
prepare-all = "python -m cycpepnet.prepare --stage all"

# FRAMEWORK RUNNER
run-framework-non-neural = "python -m cycpepnet.runner --model-type non-neural"
run-framework-neural     = "python -m cycpepnet.runner --model-type neural"
run-framework            = "python -m cycpepnet.runner"

# PREPARATION, REPRODUCTION, VERIFICATION, VALIDATION
prepare   = "python -m cycpepnet.prepare"
reproduce = "python -m cycpepnet.reproduce"
verify    = "python -m cycpepnet.verify"