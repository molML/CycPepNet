[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name            = "cycpepnet"
version         = "1.0.0"
description     = "An open framework for comparing molecular representations and machine-learning models on cyclic-peptide binding affinity, membrane permeability and half-life"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
authors         = [{ name = "Markel Benito" }, { name = "Francesca Grisoni" }]
keywords        = ["cyclic peptides", "molecular representations", "property prediction", "cheminformatics", "machine learning"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "scikit-learn>=1.8.0,<2",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "rdkit>=2025.9.6",
    "tqdm>=4.67.1,<5",
]

[project.optional-dependencies]
train = [
    "torch>=2.7.0,<2.8",
    "torch-geometric>=2.7.0,<2.8",
    "transformers>=5.5.1,<6",
    "safetensors>=0.7.0",
    "huggingface_hub",
    "xgboost>=3.2.0",
    "optuna>=4.7.0",
    "wandb>=0.25.0,<0.26",
    "openpyxl>=3.1",
    "p2smi>=1.1.1,<2",
    "mapchiral>=0.0.7",
    "mxfp>=1.1.3",
    "hyper-fingerprints>=0.2.2",
]

[project.urls]
Repository = "https://github.com/molML/CycPepNet"

[tool.setuptools.packages.find]
include = ["cycpepnet*"]
